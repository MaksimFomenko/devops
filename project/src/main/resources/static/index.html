<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Питомцы и владельцы</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #20252b; background: #f4f6f8; }
    body { max-width: 960px; margin: 32px auto; padding: 0 16px; }
    h1 { margin-bottom: 8px; }
    .hint { color: #5d6670; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    section { background: white; border: 1px solid #dce1e6; border-radius: 10px; padding: 18px; }
    form { display: grid; gap: 9px; margin: 14px 0 20px; }
    input, select, button { font: inherit; padding: 9px 10px; border: 1px solid #c6cdd4; border-radius: 6px; }
    button { cursor: pointer; background: #155eef; color: white; border-color: #155eef; }
    button.delete { background: #fff; color: #b42318; border-color: #f1b5af; padding: 5px 9px; }
    button.edit { background: #fff; color: #155eef; padding: 5px 9px; }
    .actions { display: flex; gap: 6px; flex-shrink: 0; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #eceff2; }
    .item { min-width: 0; overflow-wrap: anywhere; }
    #message { min-height: 1.5em; color: #155eef; }
    #message.error { color: #b42318; }
  </style>
</head>
<body>
  <h1>Питомцы и владельцы</h1>
  <p class="hint">Учебное приложение Spring Boot. Данные хранятся в PostgreSQL.</p>
  <p id="message" role="status"></p>
  <main class="grid">
    <section>
      <h2>Владельцы</h2>
      <form id="owner-form">
        <input name="name" placeholder="Имя (с заглавной буквы)" required>
        <input name="email" type="email" placeholder="Электронная почта" required>
        <button type="submit">Добавить владельца</button>
      </form>
      <ul id="owners"></ul>
    </section>
    <section>
      <h2>Питомцы</h2>
      <form id="pet-form">
        <input name="name" placeholder="Кличка (с заглавной буквы)" required>
        <input name="age" type="number" min="0" placeholder="Возраст" required>
        <input name="type" placeholder="Вид, например Cat или Dog" required>
        <select name="userId" id="owner-select" required><option value="">Выберите владельца</option></select>
        <button type="submit">Добавить питомца</button>
      </form>
      <ul id="pets"></ul>
    </section>
  </main>
  <script>
    const message = document.querySelector('#message');
    async function request(path, options) {
      const response = await fetch(path, options);
      const text = await response.text();
      let result;
      try { result = text ? JSON.parse(text) : null; } catch { result = text; }
      if (!response.ok) throw new Error(result?.error || result || `HTTP ${response.status}`);
      return result;
    }
    function showMessage(text, error = false) {
      message.textContent = text;
      message.classList.toggle('error', error);
    }
    async function refresh() {
      const [owners, pets] = await Promise.all([request('/api/users'), request('/api/pets')]);
      const ownerList = document.querySelector('#owners');
      const petList = document.querySelector('#pets');
      const ownerSelect = document.querySelector('#owner-select');
      ownerList.replaceChildren();
      petList.replaceChildren();
      ownerSelect.replaceChildren(new Option('Выберите владельца', ''));
      owners.forEach(owner => {
        const option = new Option(`${owner.name} (#${owner.id})`, owner.id);
        ownerSelect.add(option);
        const item = document.createElement('li');
        const label = document.createElement('span');
        label.className = 'item';
        label.textContent = `${owner.name} — ${owner.email} (#${owner.id})`;
        const actions = document.createElement('span'); actions.className = 'actions';
        const edit = document.createElement('button');
        edit.className = 'edit'; edit.textContent = 'Изменить';
        edit.onclick = () => editOwner(owner);
        const button = document.createElement('button');
        button.className = 'delete'; button.textContent = 'Удалить';
        button.onclick = () => removeItem(`/api/users/${owner.id}`, 'владельца');
        actions.append(edit, button); item.append(label, actions); ownerList.append(item);
      });
      pets.forEach(pet => {
        const item = document.createElement('li');
        const label = document.createElement('span');
        label.className = 'item';
        label.textContent = `${pet.name} — ${pet.type}, ${pet.age} лет; владелец: ${pet.user?.name || 'не указан'} (#${pet.id})`;
        const actions = document.createElement('span'); actions.className = 'actions';
        const edit = document.createElement('button');
        edit.className = 'edit'; edit.textContent = 'Изменить';
        edit.onclick = () => editPet(pet);
        const button = document.createElement('button');
        button.className = 'delete'; button.textContent = 'Удалить';
        button.onclick = () => removeItem(`/api/pets/${pet.id}`, 'питомца');
        actions.append(edit, button); item.append(label, actions); petList.append(item);
      });
    }
    async function editOwner(owner) {
      const name = prompt('Имя владельца:', owner.name);
      if (name === null) return;
      const email = prompt('Электронная почта:', owner.email);
      if (email === null) return;
      try {
        await request(`/api/users/${owner.id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: name.trim(), email: email.trim()}) });
        showMessage('Данные владельца обновлены.'); await refresh();
      } catch (error) { showMessage(error.message, true); }
    }
    async function editPet(pet) {
      const name = prompt('Кличка питомца:', pet.name);
      if (name === null) return;
      const ageInput = prompt('Возраст:', pet.age);
      if (ageInput === null) return;
      const type = prompt('Вид:', pet.type);
      if (type === null) return;
      const age = Number(ageInput);
      if (!Number.isInteger(age)) { showMessage('Возраст должен быть целым числом.', true); return; }
      try {
        await request(`/api/pets/${pet.id}`, { method: 'PUT', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name: name.trim(), age, type: type.trim()}) });
        showMessage('Данные питомца обновлены.'); await refresh();
      } catch (error) { showMessage(error.message, true); }
    }
    async function removeItem(path, name) {
      try { await request(path, { method: 'DELETE' }); showMessage(`Удалён: ${name}.`); await refresh(); }
      catch (error) { showMessage(error.message, true); }
    }
    document.querySelector('#owner-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      try {
        await request('/api/users', { method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(Object.fromEntries(new FormData(form))) });
        form.reset(); showMessage('Владелец добавлен.'); await refresh();
      } catch (error) { showMessage(error.message, true); }
    });
    document.querySelector('#pet-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const values = Object.fromEntries(new FormData(form));
      values.age = Number(values.age); values.userId = Number(values.userId);
      try {
        await request('/api/pets', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(values) });
        form.reset(); showMessage('Питомец добавлен.'); await refresh();
      } catch (error) { showMessage(error.message, true); }
    });
    refresh().catch(error => showMessage(error.message, true));
  </script>
</body>
</html>
